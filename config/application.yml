server:
  port: 8082
  # за Vite proxy redirect_uri и post-logout redirect должны строиться от адреса UI, а не gateway
  forward-headers-strategy: framework

invest:
  gateway:
    invest-api-uri: http://127.0.0.1:8081
    # публичный режим: чтение облигаций без входа; уведомления и портфель - только с сессией
    public-access:
      enabled: true
      # анонимные запросы к /api/** и к SEO-страницам с одного IP: запас и скорость пополнения в минуту (0 - без ограничения)
      rate-limit:
        requests-per-minute: 120
        max-clients: 10000
    # SEO-страницы (/bonds, /bonds/{ticker}, /issuers/{id}, /collections/{slug}, sitemap.xml, robots.txt):
    # index.html UI с метаданными и готовым содержимым. Работают только вместе с public-access
    seo:
      enabled: true
      # адрес сайта для canonical, og:url и sitemap; не задан - из запроса (X-Forwarded-*)
      # public-url: https://bonds.example
      # откуда брать index.html собранного UI: Vite в dev, сервис nginx UI на стенде
      ui-url: http://127.0.0.1:5173
      template-ttl: 1m
  keycloak:
    issuer-uri: http://localhost:8180/realms/invest

spring:
  application:
    name: invest-gateway
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: invest-gateway
            # dev-значение совпадает с keycloak/import/invest-realm.json, вне локального стенда задавать через env
            client-secret: ${KEYCLOAK_CLIENT_SECRET:invest-gateway-dev-secret}
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: ${invest.keycloak.issuer-uri}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # наружу открыты облигации, уведомления, портфель и календарь выплат по личной ссылке (.ics);
            # maintenance-эндпоинты invest-api недоступны. Пользователя invest-api получает в X-User-Id
            # (UserIdHeaderFilter), календарь по ссылке - по токену в пути
            - id: invest-api
              uri: ${invest.gateway.invest-api-uri}
              predicates:
                - Path=/api/bonds/**,/api/alerts/**,/api/portfolio/**,/api/calendar/**
              filters:
                - RewritePath=/api/(?<segment>.*), /internal/rest/$\{segment}

management:
  endpoints:
    web:
      exposure:
        include: health
